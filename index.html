async function auth(role,reg){

    let r=await sb.auth.signInWithPassword({email:em,password:pw});

}

function loginp(reg=false){return authf('c',reg)+`<p><a onclick="go('${reg?'login':'register'}')">${reg?t('login'):t('reg')}</a> · <a onclick="go('vendor-login')">دخول البائع</a></p>`}
function joinp(){return `<div class="box"><h2>${t('join')}</h2><input id="jn" placeholder="${t('name')}"><input id="jp" placeholder="${t('phone')}" dir="ltr"><input id="jm" placeholder="${t('mail')}" type="email" dir="ltr"><input id="jw" type="password" placeholder="${t('pass')}" dir="ltr"><button onclick="jr()">${t('save')}</button><p id="je" class="err"></p></div>`}

async function jr(){
  if(!sb)return;
  let n=$('#jn').value.trim(),p=$('#jp').value.trim(),e=$('#jm').value.trim(),w=$('#jw').value;
  let je=$('#je');je.textContent='';
  if(!n||!p||!e||!w){je.textContent='أكمل جميع الحقول المطلوبة';return;}
  let r=await sb2.auth.signUp({email:e,password:w,options:{data:{name:n}}});
  if(r.error){je.textContent=r.error.message;return;}
  let userId=r.data.user?.id||null;
  let {error}=await sb.from('vendor_requests').insert({name:n,phone:p,email:e,user_id:userId});
  if(error){
    let {error:err2}=await sb.from('vendors').insert({name:n,phone:p,user_id:userId});
    if(err2){je.textContent='حدث خطأ أثناء حفظ الطلب، يرجى المحاولة مجدداً';return;}
  }
  je.style.color='var(--gold2)';
  je.textContent=t('sent');
}

function support(){let s=D.set,wa=String(s.sw||'').replace(/\D/g,'');return `<h1 class="pr">${t('support')}</h1><p class="mut">فريق جواهر الشرق متواجد لمساعدتك</p><div class="row" style="align-items:flex-start"><div class="box"><h3>قنوات التواصل</h3>${wa?`<p><a class="btn" href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener">واتساب الدعم</a></p>`:''}${s.sp?`<p><a class="btn o" href="tel:${esc(s.sp)}">📞 اتصال: ${esc(s.sp)}</a></p>`:''}${s.se?`<p><a class="btn o" href="mailto:${esc(s.se)}">✉ ${esc(s.se)}</a></p>`:''}${s.si?`<p><a class="btn o" href="${esc(s.si)}" target="_blank" rel="noopener">Instagram</a></p>`:''}${s.sx?`<p><a class="btn o" href="${esc(s.sx)}" target="_blank" rel="noopener">Twitter / X</a></p>`:''}</div><div class="box"><h3>أرسل رسالة</h3><input id="tn" placeholder="${t('name')}"><input id="tp" placeholder="${t('phone')}" dir="ltr"><textarea id="tm" rows="4" placeholder="${t('supportmsg')}"></textarea><button onclick="tk()">${t('send')}</button><p id="te"></p></div></div>`}
async function tk(){if(!sb)return;let msg=$('#tm').value.trim();if(!msg)return;let {error}=await sb.from('support_tickets').insert({name:$('#tn').value,phone:$('#tp').value,message:msg});$('#te').textContent=error?t('err'):t('received');if(!error)$('#tm').value=''}
async function vendorPortal(){if(S?.role!=='vendor')return go('login');let my=D.products.filter(p=>p.v===S.vid);return `<h1>${t('mine')} (${esc(S.name)})</h1><p><button onclick="go('add')">${t('add')}</button></p><div class="grid">${my.map(pcard).join('')||t('empty')}</div>`}
async function addProductForm(){if(S?.role!=='vendor')return go('login');return `<div class="box"><h2>${t('add')}</h2><input id="pn" placeholder="${t('name')}"><textarea id="pd" rows="3" placeholder="${t('desc')}"></textarea><input id="pp" type="number" step="0.01" placeholder="${t('price')}"><input id="pi" placeholder="رابط الصورة (URL)"><button onclick="saveProduct()">${t('save')}</button><p id="pe" class="err"></p></div>`}
async function saveProduct(){if(!sb)return;let n=$('#pn').value.trim(),d=$('#pd').value.trim(),pr=$('#pp').value,img=$('#pi').value.trim();if(!n||!pr){$('#pe').textContent='أدخل اسم المنتج والسعر';return}let {error}=await sb.from('products').insert({vendor_id:S.vid,name:n,description:d,price:parseFloat(pr),images:img?[img]:[]});if(error){$('#pe').textContent=t('err');return}await load();go('vendor')}
async function adminPortal(){if(S?.role!=='owner')return go('login');let [reqs,ors]=await Promise.all([sb.from('vendor_requests').select('*'),sb.from('orders').select('*').order('created_at',{ascending:false})]);let rLst=reqs.data||[],oLst=ors.data||[];return `<h1>لوحة التحكم</h1><h2 class="t">طلبات البائعين</h2><div class="box wide"><table><tr><th>الاسم</th><th>الهاتف</th><th>البريد</th><th>إجراء</th></tr>${rLst.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.phone)}</td><td>${esc(r.email)}</td><td><button onclick="appV('${r.id}')">${t('approve')}</button> <button class="d" onclick="rejV('${r.id}')">${t('reject')}</button></td></tr>`).join('')||`<tr><td colspan="4">${t('empty')}</td></tr>`}</table></div><h2 class="t">الطلبات المسجلة</h2><div class="box wide"><table><tr><th>رقم الطلب</th><th>الزبون</th><th>الهاتف</th><th>المبلغ</th><th>التاريخ</th></tr>${oLst.map(o=>`<tr><td>${esc(o.id)}</td><td>${esc(o.customer_name)}</td><td>${esc(o.customer_phone)}</td><td>$${(+o.total).toFixed(2)}</td><td>${new Date(o.created_at).toLocaleString()}</td></tr>`).join('')||`<tr><td colspan="5">${t('empty')}</td></tr>`}</table></div>`}
async function appV(id){if(!sb)return;let {data:r}=await sb.from('vendor_requests').select('*').eq('id',id).single();if(!r)return;let {error}=await sb.from('vendors').insert({name:r.name,phone:r.phone,user_id:r.user_id});if(!error)await sb.from('vendor_requests').delete().eq('id',id);await load();R()}
async function rejV(id){if(!sb)return;await sb.from('vendor_requests').delete().eq('id',id);await load();R()}
async function R(){let hash=location.hash.slice(2),m=$('#app');if(!m)return;m.innerHTML=`<header><div class="logo" onclick="go()">${t('brand')}</div><nav>${nav()}</nav></header><main id="main"></main>${footer()}`;let mm=$('#main');
try{
if(!D.products.length)await load();
if(hash===''||hash==='/')mm.innerHTML=home();
else if(hash.startsWith('v/'))mm.innerHTML=vstore(hash.split('/')[1]);
else if(hash.startsWith('p/'))mm.innerHTML=pp(hash.split('/')[1]);
else if(hash==='cart')mm.innerHTML=cartv();
else if(hash==='support')mm.innerHTML=support();
else if(hash==='login')mm.innerHTML=loginp(false);
else if(hash==='register')mm.innerHTML=loginp(true);
else if(hash==='vendor-login')mm.innerHTML=authf('v');
else if(hash==='join')mm.innerHTML=joinp();
else if(hash==='vendor')mm.innerHTML=await vendorPortal();
else if(hash==='add')mm.innerHTML=await addProductForm();
else if(hash==='jas-portal')mm.innerHTML=await adminPortal();
else mm.innerHTML=home();
}catch(e){mm.innerHTML=`<p class="err">${t('err')}</p>`}}
(async()=>{await who();await load();R()})();
</script>
</body>
</html>
