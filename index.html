// --- [تصحيح دالة تسجيل الدخول والتحقق] ---
async function auth(role,reg){
  let em=$('#ae').value.trim(),pw=$('#aw').value,m=$('#am');
  m.textContent = ''; // مسح الأخطاء القديمة
  
  if(!em || !pw){
    m.textContent = 'يرجى إدخال البريد الإلكتروني وكلمة المرور';
    return;
  }

  if(reg){
    let r=await sb.auth.signUp({email:em,password:pw,options:{data:{name:$('#an')?.value||em}}});
    if(r.error){
      m.textContent = r.error.message;
      return;
    }
    if(!r.data.session){
      m.textContent='تحقق من بريدك الإلكتروني لتأكيد الحساب';
      return;
    }
  } else {
    let r=await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error){
      // رسالة خطأ واضحة ومفهومة عند فشل تسجيل الدخول
      m.textContent = 'خطأ في البريد أو كلمة المرور، يرجى المحاولة مجدداً';
      return;
    }
  }
  
  await who();
  
  if((role==='o'&&S?.role!=='owner')||(role==='v'&&S?.role!=='vendor')){
    await sb.auth.signOut();
    S=null;
    m.textContent='هذا الحساب لا يملك الصلاحية المطلوبة';
    return;
  }
  
  await load();
  go(S?.role==='owner'?'jas-portal':S?.role==='vendor'?'vendor':'');
}

function joinp(){return `<div class="box"><h2>${t('join')}</h2><input id="jn" placeholder="${t('name')}"><input id="jp" placeholder="${t('phone')}" dir="ltr"><input id="jm" placeholder="${t('mail')}" type="email" dir="ltr"><input id="jw" type="password" placeholder="${t('pass')}" dir="ltr"><button onclick="jr()">${t('save')}</button><p id="je" class="err"></p></div>`}

// --- [تصحيح دالة انضمام البائع لتجنب أخطاء قاعدة البيانات] ---
async function jr(){
  let n=$('#jn').value.trim(),p=$('#jp').value.trim(),e=$('#jm').value.trim(),w=$('#jw').value;
  let je = $('#je');
  je.textContent = '';

  if(!n||!p||!e||!w){
    je.textContent='أكمل جميع الحقول المطلوبة';
    return;
  }

  // 1. إنشاء حساب المستخدم في نظام التوثيق
  let r=await sb.auth.signUp({email:e,password:w,options:{data:{name:n}}});
  if(r.error){
    je.textContent = r.error.message;
    return;
  }

  let userId = r.data.user?.id || null;

  // 2. إدخال البيانات في جدول البائعين أو الطلبات (يتم استخدام جدول vendors أو vendor_requests بحسب المتاح)
  let {error}=await sb.from('vendor_requests').insert({name:n,phone:p,email:e,user_id:userId});
  
  if(error){
    // محاولة إدراج بديلة في جدول vendors مباشرة إذا كان جدول vendor_requests غير موجود
    let {error: err2} = await sb.from('vendors').insert({name:n,phone:p,user_id:userId});
    if(err2){
      je.textContent = 'حدث خطأ أثناء حفظ الطلب، يرجى المحاولة مجدداً';
      return;
    }
  }
  
  je.style.color = 'var(--gold2)';
  je.textContent = t('sent');
}
