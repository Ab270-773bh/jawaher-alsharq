async function order(vid){let its=cart.map(id=>D.products.find(p=>p.id==id)).filter(p=>p&&p.v==vid);if(!its.length)return;let customerName=$('#cn').value.trim(),localPhone=$('#cp').value.trim().replace(/\D/g,''),country=($('#cc')||{}).value||'sy',codes={sy:'963',iq:'964',ir:'98',nl:'31'},customerPhone=(codes[country]||'963')+localPhone;if(!customerName||!localPhone){alert('يرجى إدخال اسم الزبون ورقم هاتفه');return}let vendor=vn(vid),wa=String(vendor.phone||'').replace(/\D/g,'');if(!wa){alert('رقم البائع غير متوفر. يرجى التواصل مع الدعم.');return}let total=its.reduce((sum,p)=>sum+(+p.price||0),0),orderNo='JAS-'+Date.now().toString().slice(-8),date=new Date().toLocaleString(L==='ar'?'ar-SY':L==='fa'?'fa-IR':'en-US');let {error}=await sb.from('orders').insert({vendor_id:vid,customer_name:customerName,customer_phone:customerPhone,items:its.map(p=>`${p.name} x1`),total});if(error){alert('تعذر تسجيل الطلب في قاعدة البيانات. لم يتم حذف السلة.');return}let message=['💎 *طلب جديد من جواهر الشرق*',`رقم الطلب: ${orderNo}`,`التاريخ: ${date}`,`الزبون: ${customerName}`,`هاتف الزبون: +${customerPhone}`,`البائع: ${vendor.name||''}`,'','المنتجات:',...its.map((p,i)=>`${i+1}. ${p.name} — $${(+p.price).toFixed(2)} × 1`),'',`الإجمالي: $${total.toFixed(2)}`,'يرجى تأكيد التوفر والتوصيل والدفع.'].join('\n');let invoice=makeInvoice({its,customerName,customerPhone,vendor,total,orderNo,date});let blob=await new Promise(resolve=>invoice.toBlob(resolve,'image/png'));let file=new File([blob],`${orderNo}.png`,{type:'image/png'});let shared=false;if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){try{await navigator.share({files:[file],title:'صورة طلب جواهر الشرق',text:message});shared=true}catch(e){if(e.name==='AbortError')return}}if(!shared){downloadBlob(blob,`${orderNo}.png`);let link='https://wa.me/'+wa+'?text='+encodeURIComponent(message+'\n📎 تم حفظ صورة الطلب؛ يرجى إرفاق الصورة المحفوظة بالمحادثة.');window.open(link,'_blank','noopener');alert('تم تنزيل صورة الطلب وفتح
