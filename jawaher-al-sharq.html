function vstore(id){const v=db.vendors.find(x=>x.id==id);if(!v)return home();return `<h1 class=logo>${esc(v.name)}</h1><p>📞 ${esc(v.phone)}</p><div class=grid>${db.products.filter(p=>p.v==id).map(pcard).join('')||`<p>${t('empty')}</p>`}</div>`}
function pp(id){const p=db.products.find(x=>x.id==id);if(!p)return home();const v=db.vendors.find(x=>x.id==p.v)||{};
return `<div class=pg><div class=gal>${(p.imgs||[]).map(i=>`<img src="${i}" alt="">`).join('')||'<div class=card style="padding:60px;font-size:4em">💎</div>'}</div><div><h1>${esc(p.name)}</h1><div class=st style="font-size:1.4em">${stars(avg(p))} <small>(${(p.rates||[]).length})</small></div><p>${esc(p.desc)}</p><h2 class=pr>$${(+p.price).toFixed(2)}</h2><button onclick="addc('${p.id}')">🛒 ${t('add')}</button><div class=box><b>${t('contact')}:</b> ${esc(v.name)}<br><a href="tel:${esc(v.phone)}">📞 ${esc(v.phone)}</a></div><div>${t('rate')}: ${[1,2,3,4,5].map(n=>`<a onclick="rt('${p.id}',${n})" style="font-size:1.6em;cursor:pointer">★</a>`).join('')}</div></div></div>`}
function addc(id){cart.push(id);save();R()}
function rt(id,n){const p=db.products.find(x=>x.id==id);(p.rates=p.rates||[]).push(n);save();R()}
function cartv(){if(!cart.length)return `<p>${t('empty')}</p>`;
const items=cart.map(i=>db.products.find(p=>p.id==i)).filter(Boolean);
const tot=items.reduce((a,p)=>a+ +p.price,0);
const g={};items.forEach(p=>(g[p.v]=g[p.v]||[]).push(p));
return `<h1>${t('cart')}</h1>`+Object.keys(g).map(vid=>{const v=db.vendors.find(x=>x.id==vid)||{};const s=g[vid].reduce((a,p)=>a+ +p.price,0);const w=v.sham||db.set.sham;
return `<div class="box"><b>${esc(v.name)}</b>${g[vid].map(p=>`<div class=row><span>${esc(p.name)}</span><span class=pr>$${(+p.price).toFixed(2)}</span></div>`).join('')}<hr><b>${t('total')}: $${s.toFixed(2)}</b><small>${t('note')}</small><br><button onclick="order('${vid}')">${t('checkout')}</button> <a class="btn o" href="tel:${esc(v.phone)}">📞 ${esc(v.phone)}</a></div>`}).join('')+`<h3>${t('total')}: $${tot.toFixed(2)}</h3>`}
function order(vid){const items=cart.map(i=>db.products.find(p=>p.id==i)).filter(p=>p&&p.v==vid);
db.orders.push({id:uid(),v:vid,u:ss?ss.name:'guest',ph:ss?ss.phone:'',items:items.map(p=>p.name),total:items.reduce((a,p)=>a+ +p.price,0),ref:'',d:new Date().toISOString().slice(0,10)});
cart=cart.filter(i=>{const p=db.products.find(x=>x.id==i);return !(p&&p.v==vid)});save();alert(t('placed'));R()}
function authf(role,reg){return `<div class=box><h2>${reg?t('reg'):role=='c'?t('login'):role=='v'?t('vlog'):t('olog')}</h2>${reg||role=='c'?`<input id=an placeholder="${t('name')}" ${reg?'':'hidden'}>`:''}${role!='o'?`<input id=ap placeholder="${t('phone')}" dir=ltr>`:''}<input id=aw type=password placeholder="${t('pass')}" dir=ltr><button onclick="auth('${role}',${!!reg})">${reg?t('reg'):'→'}</button><p id=ae class=err></p></div>`}
async function auth(role,reg){const ph=($('#ap')||{}).value,pw=$('#aw').value,e=$('#ae');
if(role=='o'){if(await sha(pw)==(db.set.oh||'9555fb646f6bfc059624077b292839b489c1a3634e767c27415a4215a8d08e7f')){ss={role:'owner'};save();go('jas-portal')}else e.textContent=t('bad');return}
if(role=='v'){const v=db.vendors.find(x=>x.phone==ph&&x.pw==pw);if(v){ss={role:'vendor',id:v.id,name:v.name,phone:v.phone};save();go('vendor')}else e.textContent=t('bad');return}
if(reg){if(db.users.some(u=>u.phone==ph)){e.textContent=t('dup');return}const u={id:uid(),name:$('#an').value||ph,phone:ph,pw};if(!ph||!pw)return;db.users.push(u);ss={role:'c',name:u.name,phone:ph};save();go('')}
else{const u=db.users.find(x=>x.phone==ph&&x.pw==pw);if(u){ss={role:'c',name:u.name,phone:ph};save();go('')}else e.textContent=t('bad')}}
function loginp(reg){return `<div class=row style="align-items:flex-start">${authf('c',reg)}</div><p><a onclick="go('${reg?'login':'register'}')">${reg?t('login'):t('reg')}</a> · <a onclick="go('vendor-login')">${t('vlog')}</a></p>`}
function joinp(){return `<div class=box><h2>${t('join')}</h2><input id=jn placeholder="${t('name')}"><input id=jp placeholder="${t('phone')}" dir=ltr><input id=jw type=password placeholder="${t('pass')}" dir=ltr><button onclick="jr()">${t('save')}</button><p id=je></p><small>${t('joinnote')}</small></div>`}
function jr(){if(!$('#jn').value||!$('#jp').value||!$('#jw').value)return;db.reqs.push({id:uid(),name:$('#jn').value,phone:$('#jp').value,pw:$('#jw').value});save();$('#je').innerHTML=t('sent')+'<br><a class=btn onclick="go(\'support\')">'+t('contactus')+'</a>'}
function resize(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,700/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.75))};i.src=fr.result};fr.readAsDataURL(f)})}
async function ap(){const fs=[...$('#pf').files].slice(0,8);const imgs=[];for(const f of fs)imgs.push(await resize(f));
if(!$('#pn').value||(ss.role=='owner'&&!$('#pv').value))return;db.products.push({id:uid(),v:ss.role=='owner'?$('#pv').value:ss.id,name:$('#pn').value,desc:$('#pd').value,price:+$('#pr').value||0,imgs,rates:[]});save();R()}
function dp(id){db.products=db.products.filter(p=>p.id!=id);save();R()}
function vpanel(){if(!ss||ss.role!='vendor')return authf('v');
return `<h1>${esc(ss.name)} · 📞 ${esc(ss.phone)}</h1><div class=box><h3>${t('addp')}</h3><input id=pn placeholder="${t('name')}"><textarea id=pd rows=3 placeholder="${t('desc')}"></textarea><input id=pr type=number step=0.01 placeholder="${t('price')}"><label>${t('photos')}<input id=pf type=file accept="image/*" multiple></label><button onclick="ap()">${t('addp')}</button></div><h3>${t('mine')}</h3><div class=grid>${db.products.filter(p=>p.v==ss.id).map(p=>pcard(p)+'').join('')}</div><table>${db.products.filter(p=>p.v==ss.id).map(p=>`<tr><td>${esc(p.name)}</td><td><button class=d onclick="dp('${p.id}')">${t('del')}</button></td></tr>`).join('')}</table><h3>${t('orders')}</h3>${ords(ss.id)}`}
function ords(vid){const o=db.orders.filter(x=>!vid||x.v==vid);return o.length?`<table>${o.map(x=>`<tr><td>${x.d}</td><td>${esc(x.u)} ${esc(x.ph)}</td><td>${x.items.map(esc).join('، ')}</td><td>$${x.total.toFixed(2)}</td><td dir=ltr>${esc(x.ref)}</td></tr>`).join('')}</table>`:`<p>${t('empty')}</p>`}
function av(){const n=$('#vn').value,p=$('#vp').value,w=$('#vw').value;if(!n||!p||!w)return;db.vendors.push({id:uid(),name:n,phone:p,pw:w,sham:''});save();R()}
function rq(id,y){const r=db.reqs.find(x=>x.id==id);if(y)db.vendors.push({id:uid(),name:r.name,phone:r.phone,pw:r.pw,sham:''});db.reqs=db.reqs.filter(x=>x.id!=id);save();R()}
function dv(id){db.vendors=db.vendors.filter(v=>v.id!=id);db.products=db.products.filter(p=>p.v!=id);save();R()}
function ss2(){db.set.sw=$('#sw').value;db.set.sp=$('#sp').value;db.set.se=$('#se').value;(async()=>{if($('#op').value)db.set.oh=await sha($('#op').value);save();R()})()}
function opanel(){if(!ss||ss.role!='owner')return authf('o');
return `<h1>${t('olog')}</h1><div class="box wide"><h3>${t('reqs')}</h3>${db.reqs.map(r=>`<div class=row><b>${esc(r.name)}</b> ${esc(r.phone)} <button onclick="rq('${r.id}',1)">${t('ok')}</button><button class=d onclick="rq('${r.id}',0)">${t('no')}</button></div>`).join('')||`<p>${t('empty')}</p>`}</div>
<div class="box wide"><h3>${t('addv')}</h3><div class=row><input id=vn placeholder="${t('name')}" style="width:180px"><input id=vp placeholder="${t('phone')}" dir=ltr style="width:160px"><input id=vw placeholder="${t('pass')}" dir=ltr style="width:140px"><button onclick="av()">${t('addv')}</button></div><table>${db.vendors.map(v=>`<tr><td>${esc(v.name)}</td><td>${esc(v.phone)}</td><td>${db.products.filter(p=>p.v==v.id).length}</td><td><button class=d onclick="dv('${v.id}')">${t('del')}</button></td></tr>`).join('')}</table></div>
<div class="box wide"><h3>${t('addp')}</h3><select id=pv>${db.vendors.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('')}</select><input id=pn placeholder="${t('name')}"><textarea id=pd rows=3 placeholder="${t('desc')}"></textarea><input id=pr type=number step=0.01 placeholder="${t('price')}"><label>${t('photos')}<input id=pf type=file accept="image/*" multiple></label><button onclick="ap()">${t('addp')}</button></div>
<div class="box wide"><h3>${t('prods')}</h3><table>${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc((db.vendors.find(v=>v.id==p.v)||{}).name)}</td><td>$${(+p.price).toFixed(2)}</td><td><button class=d onclick="dp('${p.id}')">${t('del')}</button></td></tr>`).join('')}</table></div>
<div class="box wide"><h3>${t('orders')}</h3>${ords()}</div>
<div class="box wide"><h3>${t('tickets')}</h3>${(db.tickets||[]).map(x=>`<div class=row><b>${esc(x.n)}</b><span dir=ltr>${esc(x.p)}</span><span>${esc(x.m)}</span><small>${x.d}</small></div>`).join('')||`<p>${t('empty')}</p>`}</div>
<div class="box"><h3>${t('set')}</h3><input id=sw placeholder="${t('wa')}" value="${esc(db.set.sw||'')}" dir=ltr><input id=sp placeholder="${t('phone')}" value="${esc(db.set.sp||'')}" dir=ltr><input id=se placeholder="${t('mail')}" value="${esc(db.set.se||'')}" dir=ltr><input id=op type=password placeholder="${t('pwd2')}" dir=ltr><button onclick="ss2()">${t('save')}</button></div>`}
function gate(){return `<div id=gate><div class=gem>💎</div><h1 class=logo>${t('brand')}</h1><p>${t('gate')}</p><div class=row><button onclick="cty('sy')">${t('sy')}</button><button onclick="cty('iq')">${t('iq')}</button><button onclick="cty('ir')">${t('ir')}</button></div></div>`}
function cty(c){localStorage.setItem('c',c);R()}
function R(){document.documentElement.lang=L;document.documentElement.dir=L=='en'?'ltr':'rtl';document.body.dataset.l=L;
if(!localStorage.getItem('c')){$('#app').innerHTML=gate();return}
const h=(location.hash||'#/').slice(2).split('/'),p=h[0];let m;
if(p=='v')m=vstore(h[1]);else if(p=='p')m=pp(h[1]);else if(p=='cart')m=cartv();else if(p=='login')m=loginp();else if(p=='register')m=loginp(1);else if(p=='vendor-login')m=authf('v');else if(p=='join')m=joinp();else if(p=='support')m=supp();else if(p=='vendor')m=vpanel();else if(p=='jas-portal')m=opanel();else m=home();
$('#app').innerHTML=`<header><span class=logo onclick="go('')">💎 ${t('brand')}</span><nav>${nav()}</nav></header><main>${m}</main>${foot()}`}
R();
</script>
</body>
</html>
